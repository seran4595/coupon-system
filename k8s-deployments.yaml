apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon-app
      version: v1
  template:
    metadata:
      labels:
        app: coupon-app
        version: v1
    spec:
      containers:
      - name: coupon-app
        image: seran4595/coupon-app:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-service-v1
spec:
  type: NodePort
  selector:
    app: coupon-app
    version: v1
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
---
