<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coupon System - v1 (24MIS0579)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #e9ecef; margin: 5px 0; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Coupon System - v1 (Add Coupon)</h2>
        <input type="text" id="code" placeholder="Coupon Code (e.g. SAVE20)">
        <input type="number" id="discount" placeholder="Discount % (e.g. 20)">
        <input type="date" id="expiry">
        <button onclick="addCoupon()">Create Coupon</button>
        <h3>Created Coupons</h3>
        <ul id="couponList"></ul>
    </div>
    <script>
        let coupons = [];
        function addCoupon() {
            const code = document.getElementById('code').value.trim().toUpperCase();
            const discount = document.getElementById('discount').value;
            const expiry = document.getElementById('expiry').value;
            if (!code || !discount || !expiry) return alert("Fill all fields!");
            coupons.push({ code, discount: Number(discount), expiry });
            render();
        }
        function render() {
            document.getElementById('couponList').innerHTML = coupons.map(c => `<li><b>${c.code}</b> - ${c.discount}% off (Expires: ${c.expiry})</li>`).join('');
        }
    </script>
</body>
</html>
